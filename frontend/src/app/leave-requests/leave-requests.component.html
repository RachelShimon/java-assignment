<h2>Leave Requests</h2>

<div *ngIf="loading">Loading...</div>
<div class="error" *ngIf="loadError">{{ loadError }}</div>

<table *ngIf="!loading && !loadError">
  <thead>
    <tr>
      <th>#</th>
      <th>Employee</th>
      <th>Type</th>
      <th>Start</th>
      <th>End</th>
      <th>Days</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of requests">
      <td>{{ r.id }}</td>
      <td>{{ r.employee?.name }}</td>
      <td>{{ typeLabel(r.type) }}</td>
      <td>{{ r.startDate | date: 'dd/MM/yyyy' }}</td>
      <td>{{ r.endDate | date: 'dd/MM/yyyy' }}</td>
      <td>{{ r.days }}</td>
      <td>{{ statusLabel(r.status) }}</td>
      <td>
        <button *ngIf="r.status === LeaveStatus.Pending" (click)="approve(r)">Approve</button>
      </td>
    </tr>
  </tbody>
</table>
